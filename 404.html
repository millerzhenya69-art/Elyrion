<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<title data-i18n="meta.404.title">Страница не найдена — Elyrion</title>
<meta name="description" content="Такой страницы нет." data-i18n-content="meta.404.desc">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#050505" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="assets/img/favicon-for-light-tab.png" media="(prefers-color-scheme: light)">
<link rel="icon" type="image/png" href="assets/img/favicon-for-dark-tab.png" media="(prefers-color-scheme: dark)">
<script>
(function(){var d=document.documentElement;try{
var t=localStorage.getItem('elyrion-theme');
if(!t){t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
d.setAttribute('data-theme',t);
var l=localStorage.getItem('elyrion-lang');
if(!l){l=((navigator.language||'en').toLowerCase().indexOf('ru')===0)?'ru':'en';}
d.lang=l;}catch(e){}})();
</script>
<link rel="preload" href="assets/fonts/Onest-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Spectral-Light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/site.css">
<noscript><style>html:not(.is-ready) body{opacity:1!important;animation:none!important}</style></noscript>
</head>
<body>
<div id="site-header"></div>

<main id="main">
  <header class="page-head">
    <div class="wrap">
      <h1 class="page-title" data-i18n="404.h1">Страница не найдена</h1>
      <p class="page-lead" data-i18n="404.lead">Такой страницы нет или она переехала. Вернитесь на главную.</p>
      <div class="actions" style="margin-top:2rem">
        <a class="btn btn--primary" href="index.html" data-i18n="404.cta">На главную</a>
      </div>
    </div>
  </header>
</main>

<div id="site-footer"></div>

<script src="js/en.js"></script>
<script src="js/news-data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
